<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Hogwarts TV Launcher</title>
<style>
  * { box-sizing: border-box; user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;
    background: #0a0b10; font-family: 'Georgia', 'Times New Roman', serif; color: #f6e7c1;
  }

  #wallpaper {
    position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover;
    transition: opacity 1.2s ease, filter 1.5s ease; z-index: 1;
  }
  #dayNightTint {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    transition: background 2s ease;
  }
  #weatherCanvas {
    position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3;
  }
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 4;
    background: radial-gradient(circle at center, rgba(0,0,0,0.08) 35%, rgba(4,4,10,0.78) 100%);
  }

  /* Top Left: Ornate Hogwarts Manual Analog Clock */
  #clockContainer {
    position: fixed; top: 36px; left: 46px; z-index: 10;
    display: flex; align-items: center; gap: 22px;
    background: rgba(14, 11, 8, 0.58); border: 1.5px solid rgba(218, 178, 96, 0.55);
    border-radius: 24px; padding: 16px 26px 16px 18px;
    box-shadow: 0 12px 36px rgba(0,0,0,0.65), inset 0 0 24px rgba(218, 178, 96, 0.14);
  }
  #hogwartsClock { width: 170px; height: 170px; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.8)); }
  .clock-meta { display: flex; flex-direction: column; gap: 6px; }
  .clock-location {
    font-size: 15px; letter-spacing: 2px; text-transform: uppercase;
    color: #e5be6b; text-shadow: 0 2px 6px rgba(0,0,0,0.9);
  }
  .clock-date {
    font-size: 22px; font-weight: bold; color: #fff4d6;
    text-shadow: 0 2px 8px rgba(0,0,0,0.9);
  }
  .clock-weather {
    font-size: 15px; color: #d6c39c; display: flex; align-items: center; gap: 8px;
  }

  /* Top Right: Marauder's Corner Parchment Mirror */
  #parchmentWidget {
    position: fixed; top: 36px; right: 46px; width: 340px; min-height: 210px; z-index: 10;
    background: linear-gradient(145deg, rgba(244, 228, 188, 0.92), rgba(222, 196, 142, 0.90));
    color: #2c190a; border: 2px solid #8c6229; border-radius: 14px; padding: 14px 16px;
    box-shadow: 0 14px 36px rgba(0,0,0,0.72), inset 0 0 28px rgba(139, 90, 29, 0.35);
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .parchment-header {
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px dashed rgba(92, 56, 18, 0.45); padding-bottom: 6px; margin-bottom: 8px;
    font-size: 13px; font-weight: bold; letter-spacing: 1px; color: #5c3610;
  }
  #parchmentText {
    font-size: 17px; line-height: 1.35; font-style: italic; color: #261407;
    white-space: pre-wrap; word-break: break-word; max-height: 75px; overflow: hidden;
  }
  #parchmentImg {
    width: 100%; height: 130px; object-fit: contain; display: none; margin-top: 4px;
  }
  .parchment-footer {
    margin-top: 8px; padding-top: 5px; border-top: 1px dashed rgba(92, 56, 18, 0.35);
    font-size: 11px; color: #694118; text-align: right;
  }

  /* Hide duplicate HTML dock/owl/settings since native Kotlin overlay handles them */
  #dockWrapper, #settingsBtn, #hedwig, #settingsModal { display: none !important; }
</style>
</head>
<body>

  <img id="wallpaper" src="file:///android_asset/bg_1.png" alt="Hogwarts Scene" />
  <div id="dayNightTint"></div>
  <canvas id="weatherCanvas"></canvas>
  <div id="vignette"></div>

  <!-- Top-Left: Manual Hogwarts Analog Clock -->
  <div id="clockContainer">
    <svg id="hogwartsClock" viewBox="0 0 200 200">
      <defs>
        <radialGradient id="dialGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#2a1f14" />
          <stop offset="82%" stop-color="#140e09" />
          <stop offset="100%" stop-color="#090604" />
        </radialGradient>
      </defs>
      <circle cx="100" cy="100" r="95" fill="url(#dialGrad)" stroke="#d8ab4e" stroke-width="4" />
      <circle cx="100" cy="100" r="86" fill="none" stroke="#8a6626" stroke-width="1.2" stroke-dasharray="3 3" />
      <g id="clockTicks"></g>
      <text x="100" y="31" fill="#f3cf7a" font-size="14" font-weight="bold" text-anchor="middle">XII</text>
      <text x="169" y="105" fill="#f3cf7a" font-size="14" font-weight="bold" text-anchor="middle">III</text>
      <text x="100" y="179" fill="#f3cf7a" font-size="14" font-weight="bold" text-anchor="middle">VI</text>
      <text x="31" y="105" fill="#f3cf7a" font-size="14" font-weight="bold" text-anchor="middle">IX</text>
      <polygon points="100,82 105,95 118,100 105,105 100,118 95,105 82,100 95,95" fill="rgba(216,171,78,0.25)" />
      <line id="hourHand" x1="100" y1="100" x2="100" y2="54" stroke="#f6d27a" stroke-width="5.5" stroke-linecap="round" />
      <line id="minHand" x1="100" y1="100" x2="100" y2="34" stroke="#fff2cf" stroke-width="3.5" stroke-linecap="round" />
      <line id="secHand" x1="100" y1="112" x2="100" y2="28" stroke="#c94a38" stroke-width="1.6" stroke-linecap="round" />
      <circle cx="100" cy="100" r="5.5" fill="#ffd875" stroke="#3b260b" stroke-width="1.5" />
    </svg>
    <div class="clock-meta">
      <div class="clock-location" id="sceneTitle">HOGWARTS CASTLE</div>
      <div class="clock-date" id="dateText">Tuesday, Nov 24</div>
      <div class="clock-weather" id="weatherStatus">Enchanted Sky • Loading...</div>
    </div>
  </div>

  <!-- Top-Right: Live Phone-Mirrored Parchment Pad -->
  <div id="parchmentWidget">
    <div>
      <div class="parchment-header">
        <span>✦ MARAUDER'S NOTE</span>
        <span id="padSyncBadge">LIVE</span>
      </div>
      <div id="parchmentText">I solemnly swear that I am up to no good...</div>
      <img id="parchmentImg" alt="Sketch" />
    </div>
    <div class="parchment-footer" id="padUrlHint">Phone Pad: http://... :8080</div>
  </div>

<script>
  const SCENES = [
    { file: 'bg_1.png', title: 'HOGWARTS CASTLE' },
    { file: 'bg_2.png', title: 'THE GREAT HALL' },
    { file: 'bg_3.png', title: 'HOGSMEADE VILLAGE' },
    { file: 'bg_4.png', title: 'DIAGON ALLEY' },
    { file: 'bg_5.png', title: 'HOGWARTS EXPRESS' },
    { file: 'bg_6.png', title: 'FORBIDDEN FOREST' },
    { file: 'bg_7.png', title: 'GRYFFINDOR COMMON ROOM' }
  ];

  let weatherEnabled = localStorage.getItem('hp_weather_enabled') !== 'false';
  let manualSceneIndex = localStorage.getItem('hp_manual_scene');
  let currentWeatherCode = 0;
  let currentTemp = '';
  let isDayTime = true;

  const ticksGroup = document.getElementById('clockTicks');
  for (let i = 0; i < 60; i++) {
    const angle = (i * 6) * Math.PI / 180;
    const r1 = i % 5 === 0 ? 78 : 82;
    const r2 = 86;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', 100 + r1 * Math.sin(angle));
    line.setAttribute('y1', 100 - r1 * Math.cos(angle));
    line.setAttribute('x2', 100 + r2 * Math.sin(angle));
    line.setAttribute('y2', 100 - r2 * Math.cos(angle));
    line.setAttribute('stroke', i % 5 === 0 ? '#f3cf7a' : '#7c5d24');
    line.setAttribute('stroke-width', i % 5 === 0 ? '2' : '1');
    ticksGroup.appendChild(line);
  }

  function updateClock() {
    const now = new Date();
    const sec = now.getSeconds() + now.getMilliseconds() / 1000;
    const min = now.getMinutes() + sec / 60;
    const hr = (now.getHours() % 12) + min / 60;

    document.getElementById('hourHand').setAttribute('transform', `rotate(${hr * 30} 100 100)`);
    document.getElementById('minHand').setAttribute('transform', `rotate(${min * 6} 100 100)`);
    document.getElementById('secHand').setAttribute('transform', `rotate(${sec * 6} 100 100)`);

    const opts = { weekday: 'long', month: 'short', day: 'numeric' };
    document.getElementById('dateText').textContent = now.toLocaleDateString('en-US', opts);
  }
  setInterval(updateClock, 250);
  updateClock();

  function applyWallpaperAndAtmosphere() {
    const now = new Date();
    const dayOfYear = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
    const idx = manualSceneIndex !== null ? parseInt(manualSceneIndex, 10) % SCENES.length : dayOfYear % SCENES.length;
    const scene = SCENES[idx];

    const wp = document.getElementById('wallpaper');
    const fullAssetPath = `file:///android_asset/${scene.file}`;
    if (wp.src !== fullAssetPath) wp.src = fullAssetPath;
    document.getElementById('sceneTitle').textContent = scene.title;

    const tint = document.getElementById('dayNightTint');
    if (!weatherEnabled) {
      wp.style.filter = 'brightness(1) saturate(1)';
      tint.style.background = 'transparent';
      document.getElementById('weatherStatus').textContent = 'Enchanted Atmosphere: Off';
      return;
    }

    const h = now.getHours();
    if (h >= 6 && h < 11) {
      wp.style.filter = 'brightness(1.06) saturate(1.08) sepia(0.08)';
      tint.style.background = 'linear-gradient(to bottom, rgba(255, 210, 135, 0.14), rgba(0,0,0,0.1))';
    } else if (h >= 11 && h < 17) {
      wp.style.filter = 'brightness(1.12) saturate(1.05)';
      tint.style.background = 'rgba(255, 245, 220, 0.05)';
    } else if (h >= 17 && h < 20) {
      wp.style.filter = 'brightness(0.96) saturate(1.18)';
      tint.style.background = 'linear-gradient(to bottom, rgba(224, 102, 54, 0.22), rgba(20, 14, 42, 0.28))';
    } else {
      wp.style.filter = 'brightness(0.76) contrast(1.08) saturate(0.95)';
      tint.style.background = 'linear-gradient(to bottom, rgba(10, 18, 48, 0.42), rgba(5, 7, 18, 0.45))';
    }
  }

  async function fetchWeather() {
    if (!weatherEnabled) return;
    try {
      const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=30.3165&longitude=78.0322&current=temperature_2m,weather_code,is_day');
      const data = await res.json();
      currentTemp = Math.round(data.current.temperature_2m) + '°C';
      currentWeatherCode = data.current.weather_code;
      isDayTime = data.current.is_day === 1;
      document.getElementById('weatherStatus').textContent = `${describeWeather(currentWeatherCode)} • ${currentTemp}`;
    } catch (e) {
      document.getElementById('weatherStatus').textContent = 'Enchanted Sky • Active';
    }
  }

  function describeWeather(code) {
    if (code === 0) return isDayTime ? 'Clear Sky' : 'Starlit Night';
    if (code <= 3) return 'Partly Cloudy';
    if (code <= 48) return 'Highland Mist';
    if (code <= 67 || (code >= 80 && code <= 82)) return 'Rainy Spell';
    if (code <= 77) return 'Snowfall';
    if (code >= 95) return 'Thunderstorm';
    return 'Enchanted Breeze';
  }

  const wCanvas = document.getElementById('weatherCanvas');
  const wCtx = wCanvas.getContext('2d');
  let particles = [];
  let lightningAlpha = 0;

  function resizeWeather() {
    wCanvas.width = window.innerWidth;
    wCanvas.height = window.innerHeight;
    particles = Array.from({ length: 85 }, () => ({
      x: Math.random() * wCanvas.width,
      y: Math.random() * wCanvas.height,
      speed: 1.5 + Math.random() * 4.5,
      size: 1 + Math.random() * 2.5,
      drift: (Math.random() - 0.5) * 1.2
    }));
  }
  window.addEventListener('resize', resizeWeather);
  resizeWeather();

  function renderWeatherLoop() {
    wCtx.clearRect(0, 0, wCanvas.width, wCanvas.height);
    if (weatherEnabled) {
      const isRain = (currentWeatherCode >= 51 && currentWeatherCode <= 67) || (currentWeatherCode >= 80 && currentWeatherCode <= 99);
      const isSnow = (currentWeatherCode >= 71 && currentWeatherCode <= 77);
      const isThunder = currentWeatherCode >= 95;

      if (isThunder && Math.random() < 0.004) lightningAlpha = 0.45;
      if (lightningAlpha > 0) {
        wCtx.fillStyle = `rgba(220, 235, 255, ${lightningAlpha})`;
        wCtx.fillRect(0, 0, wCanvas.width, wCanvas.height);
        lightningAlpha *= 0.86;
      }

      particles.forEach(p => {
        if (isRain) {
          wCtx.strokeStyle = 'rgba(185, 215, 255, 0.35)';
          wCtx.lineWidth = 1.2;
          wCtx.beginPath();
          wCtx.moveTo(p.x, p.y);
          wCtx.lineTo(p.x - 3, p.y + 14);
          wCtx.stroke();
          p.y += p.speed * 3.4;
          p.x -= 1.2;
        } else if (isSnow) {
          wCtx.fillStyle = 'rgba(255, 255, 255, 0.72)';
          wCtx.beginPath();
          wCtx.arc(p.x, p.y, p.size + 1, 0, Math.PI * 2);
          wCtx.fill();
          p.y += p.speed * 0.55;
          p.x += Math.sin(p.y * 0.02) * 0.8;
        } else {
          const twinkle = 0.25 + 0.55 * Math.abs(Math.sin(Date.now() * 0.002 + p.x));
          wCtx.fillStyle = `rgba(255, 224, 145, ${twinkle})`;
          wCtx.beginPath();
          wCtx.arc(p.x, p.y, p.size * 0.9, 0, Math.PI * 2);
          wCtx.fill();
          p.y -= p.speed * 0.16;
          p.x += p.drift * 0.35;
        }

        if (p.y > wCanvas.height) { p.y = -10; p.x = Math.random() * wCanvas.width; }
        if (p.y < -10) { p.y = wCanvas.height + 10; p.x = Math.random() * wCanvas.width; }
        if (p.x < 0) p.x = wCanvas.width;
        if (p.x > wCanvas.width) p.x = 0;
      });
    }
    requestAnimationFrame(renderWeatherLoop);
  }
  renderWeatherLoop();

  let lastPadUpdated = 0;
  function pollPhoneParchment() {
    if (!window.AndroidBridge) return;
    try {
      const raw = window.AndroidBridge.getPadState();
      const data = JSON.parse(raw);
      if (data.updated && data.updated !== lastPadUpdated) {
        lastPadUpdated = data.updated;
        const textEl = document.getElementById('parchmentText');
        const imgEl = document.getElementById('parchmentImg');
        textEl.textContent = data.text || (data.image ? '' : 'I solemnly swear that I am up to no good...');
        if (data.image && data.image.startsWith('data:image')) {
          imgEl.src = data.image;
          imgEl.style.display = 'block';
        } else {
          imgEl.style.display = 'none';
        }
      }
    } catch (_e) {}
  }

  window.addEventListener('load', () => {
    applyWallpaperAndAtmosphere();
    fetchWeather();
    setInterval(fetchWeather, 15 * 60 * 1000);
    setInterval(applyWallpaperAndAtmosphere, 60 * 1000);
    setInterval(pollPhoneParchment, 700);

    if (window.AndroidBridge) {
      const ip = window.AndroidBridge.getLocalIpAddress();
      document.getElementById('padUrlHint').textContent = `Phone Pad: http://${ip}:8080`;
    }
  });
</script>
</body>
</html>
