name: Build Hogwarts TV Launcher APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Gradle & Build Debug APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          ./gradle-8.7/bin/gradle assembleDebug --no-daemon

      - name: Upload Hogwarts TV Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: hogwarts-tv-launcher-apk
          path: app/build/outputs/apk/debug/app-debug.apk
